
name: Extraction Pipeline Check

on:
  workflow_dispatch:
  push:
    paths:
      - "extract_paper_meta.py"
      - "requirements.txt"
      - ".github/workflows/extraction-check.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extraction
        run: python extract_paper_meta.py --delay 2

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("extracted_papers.json")
          papers = json.loads(path.read_text(encoding="utf-8"))

          expected = {
              "2503.18382",
              "2510.13998",
              "2607.18859",
              "2507.23370",
              "2503.11651",
          }
          required = {
              "arxiv_id", "title", "authors", "publication_date",
              "arxiv_pdf_url", "arxiv_page_url", "github_url",
              "is_official_code", "tasks", "methods", "models",
              "datasets", "sota_claims", "abstract",
          }

          assert isinstance(papers, list), "Output must be a JSON list"
          assert len(papers) == 5, f"Expected 5 records, got {len(papers)}"

          ids = [paper["arxiv_id"] for paper in papers]
          assert set(ids) == expected, f"Unexpected paper IDs: {ids}"
          assert len(ids) == len(set(ids)), "Duplicate arXiv IDs found"

          for paper in papers:
              missing = required - paper.keys()
              assert not missing, (
                  f"{paper['arxiv_id']} missing fields: {missing}"
              )
              assert isinstance(paper["authors"], list)
              assert isinstance(paper["sota_claims"], list)

              for claim in paper["sota_claims"]:
                  for field in (
                      "benchmark", "metric", "value", "comparison_target"
                  ):
                      assert field in claim, (
                          f"{paper['arxiv_id']} claim missing {field}"
                      )

          print("PASS: five records and required schema validated.")
          PY
